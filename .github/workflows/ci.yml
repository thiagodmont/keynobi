name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typescript:check
      - run: npm run test

  design-system:
    name: Design System
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-
      - name: Install Playwright Chromium
        # Bounded by the step timeout alone. Do not wrap this in `timeout` or a
        # retry loop: killing the npx parent orphans the root-owned apt-get
        # child, which keeps /var/lib/dpkg/lock-frontend and makes every
        # subsequent attempt fail instantly on the lock.
        timeout-minutes: 20
        run: npx playwright install chromium --with-deps
      - run: npm run test:ds

  rust:
    name: Rust
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check TypeScript bindings are up to date
        # Runs only the ts-rs export tests, not the persistence tests.
        # A filter that matches nothing still exits 0, so require that the
        # export tests actually ran.
        run: |
          cd src-tauri
          out=$(cargo test --lib export_bindings 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | grep -E "^test result:"
          echo "$out" | grep -Eq "^test result: ok\. [1-9][0-9]* passed" || \
            (echo "ERROR: no ts-rs export_bindings tests ran" && exit 1)
          cd ..
          test -z "$(git status --porcelain src/bindings/)" || \
            (echo "ERROR: TypeScript bindings are stale. Run: npm run generate:bindings" && exit 1)
      - name: Rust tests
        run: cd src-tauri && cargo test --lib --tests
      - name: MCP smoke test (debug binary)
        # The check the release runs on each DMG's binary; the tests above built it.
        run: node scripts/mcp-smoke.mjs src-tauri/target/debug/keynobi
      - name: Rust telemetry feature (Sentry compile-time paths)
        run: |
          cd src-tauri
          cargo check --features telemetry
          cargo clippy --features telemetry -- -D warnings
          cargo test --lib --tests --features telemetry
      - name: Tests must not write the real data directory
        # Tests persist to an isolated temp dir (settings_manager::data_dir).
        # The runner's home starts clean, so any ~/.keynobi here means a test
        # bypassed the isolation and would overwrite a developer's real data.
        run: |
          if [ -e "$HOME/.keynobi" ]; then
            echo "ERROR: tests wrote to \$HOME/.keynobi. Use tests/common::isolate_data_dir()."
            ls -laR "$HOME/.keynobi"
            exit 1
          fi
      - name: Rustfmt
        run: cd src-tauri && cargo fmt --check
      - name: Clippy
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-
      - name: Install Playwright Chromium
        # Bounded by the step timeout alone. Do not wrap this in `timeout` or a
        # retry loop: killing the npx parent orphans the root-owned apt-get
        # child, which keeps /var/lib/dpkg/lock-frontend and makes every
        # subsequent attempt fail instantly on the lock.
        timeout-minutes: 20
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
